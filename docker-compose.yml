# AIVoiceBench — Docker Compose
# Usage: docker-compose up
# Then: open http://localhost:8000 (Web UI) or http://localhost:8000/docs (API)

services:
  aivoicebench:
    build: .
    container_name: aivoicebench
    ports:
      - "8000:8000"
    volumes:
      - ./data/recordings:/data/recordings:ro
      - ./data/output:/data/output
      - ./data/cache:/data/cache
      - ./config:/app/config:ro
      # Optional: mount FFmpeg binary
      # - /usr/bin/ffmpeg:/usr/local/bin/ffmpeg:ro
    environment:
      - AIVOICEBENCH_OUTPUT=/data/output
      - AIVOICEBENCH_CACHE=/data/cache
      # === LLM Provider ===
      # "mock" = no API key (default), "volcengine" = 火山引擎豆包, "openai" = OpenAI
      - AIVOICEBENCH_LLM_PROVIDER=mock
      # --- 火山引擎豆包 ---
      # Set ARK_API_KEY in .env file (never commit to git!)
      # - ARK_API_KEY=your_key_here
      # - AIVOICEBENCH_LLM_MODEL=ep-xxxxxxxx  # your endpoint ID
      # --- OpenAI ---
      # - OPENAI_API_KEY=your_key_here
      # - AIVOICEBENCH_LLM_MODEL=gpt-4o
    restart: unless-stopped
