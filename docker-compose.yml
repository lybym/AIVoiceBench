# AIVoiceBench — Docker Compose
# 
# 方式 1: 使用预构建镜像 (推荐)
#   1. docker login ghcr.io -u lybym -p YOUR_GITHUB_TOKEN
#   2. docker-compose up
#   3. 打开 http://localhost:8000
#
# 方式 2: 本地构建
#   1. 将下方 image 注释, 取消 build 注释
#   2. docker-compose up --build

services:
  aivoicebench:
    # 预构建镜像 (GitHub Actions 自动构建)
    image: ghcr.io/lybym/aivoicebench:latest
    # 本地构建 (取消注释以下行, 注释上方 image 行)
    # build: .
    container_name: aivoicebench
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/recordings:/data/recordings:ro
      - ./data/output:/data/output
      - ./data/cache:/data/cache
      - ./config:/app/config:ro
    environment:
      - AIVOICEBENCH_OUTPUT=/data/output
      - AIVOICEBENCH_CACHE=/data/cache
      # External provider/storage configuration (PRD-F015, Issue #87).
      # Copy config/providers.example.yaml and config/storage.example.yaml to
      # the runtime files below and edit them with real endpoint/model/resource.
      # These variables hold file PATHS only; secrets stay in env references.
      - AIVOICEBENCH_PROVIDERS_CONFIG=/app/config/providers.yaml
      - AIVOICEBENCH_STORAGE_CONFIG=/app/config/storage.yaml
      # Legacy signed-URL publication is no longer required in the production
      # path (Issue #87).  Inline Base64 transport works without object storage;
      # TOS is used only for over-threshold files when configured.
      # - AIVOICEBENCH_AUDIO_PUT_URL=${AIVOICEBENCH_AUDIO_PUT_URL:-}
      # - AIVOICEBENCH_AUDIO_GET_URL=${AIVOICEBENCH_AUDIO_GET_URL:-}
      # - AIVOICEBENCH_AUDIO_HOST=${AIVOICEBENCH_AUDIO_HOST:-}
      # === LLM Provider ===
      # "none" = 未配置语义评估 (默认), "volcengine" = 火山引擎豆包, "openai" = OpenAI
      - AIVOICEBENCH_LLM_PROVIDER=none
      # --- 火山引擎豆包 ---
      # 在 .env 文件中设置 (不要提交到 Git!)
      # - ARK_API_KEY=your_key_here
      # - AIVOICEBENCH_LLM_MODEL=ep-xxxxxxxx  # 你的 endpoint ID
      # --- OpenAI ---
      # - OPENAI_API_KEY=your_key_here
      # - AIVOICEBENCH_LLM_MODEL=gpt-4o
    restart: unless-stopped
