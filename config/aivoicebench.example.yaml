# AIVoiceBench Core Configuration
# TARGET SCHEMA tracked by Issue #87, implemented by PR #90 in v0.5.0-alpha.1.
# The code now consumes these external-file keys; real TOS path is pending main-line verification.
# Provider/model and object-storage settings are deliberately externalized.
# Copy the example files to server-owned runtime paths and mount them read-only.
#
# Runtime path overrides may also be supplied with:
#   AIVOICEBENCH_PROVIDERS_CONFIG
#   AIVOICEBENCH_STORAGE_CONFIG
#
# Long-lived credentials MUST NOT be written into these YAML files. Provider/storage
# files contain only credential environment-variable references.

# === External configuration files ===
providers_config: /etc/aivoicebench/providers.yaml
storage_config: /etc/aivoicebench/storage.yaml

# === Output / Cache ===
output: /data/output
cache: /data/cache

# === Audio Processing ===
# ffmpeg_path: /usr/local/bin/ffmpeg
# ffprobe_path: /usr/local/bin/ffprobe

# === Analysis Defaults ===
acoustic:
  frame_ms: 30
  hop_ms: 10
  threshold_factor: 0.15
  min_speech_ms: 100
  min_silence_ms: 200
  merge_gap_ms: 80

events:
  timeout_ms: 5000
  false_endpoint_ms: 300
  overlap_min_ms: 50

# === Web API ===
api:
  host: 0.0.0.0
  port: 8000
