# AIVoiceBench provider configuration — example only
# Runtime target: /etc/aivoicebench/providers.yaml
# Do not place credential values in this file. Use credential_env references.
#
# v0.5.0 loads this server-owned file as the non-secret source of truth.

schema_version: 1

profiles:
  - id: judge-doubao
    name: Doubao Judge
    provider: volcengine
    protocol: openai_chat
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model: "<ark-endpoint-id>"
    credential_env: ARK_API_KEY
    enabled: true
    capabilities: [judge]
    parameters:
      temperature: 0.3
      max_tokens: 4096
      timeout_seconds: 30

  - id: volc-file-asr
    name: Doubao Seed ASR 2.0 Standard
    provider: volcengine
    protocol: volcengine_asr
    base_url: https://openspeech.bytedance.com/api/v3/auc/bigmodel/submit
    model: bigmodel
    credential_env: VOLCENGINE_SPEECH_API_KEY
    enabled: true
    capabilities: [asr, diarization]
    parameters:
      resource_id: volc.seedasr.auc
      timeout_seconds: 300
      file_mode: seed_standard
      audio_transport: auto
      inline_max_bytes: 15728640
      object_storage_ref: tos-asr-temp

  - id: volc-streaming-asr
    name: Volcengine Streaming ASR
    provider: volcengine
    protocol: volcengine_streaming_asr
    base_url: wss://openspeech.bytedance.com/api/v3/sauc/bigmodel
    model: bigmodel
    credential_env: VOLCENGINE_SPEECH_API_KEY
    enabled: true
    capabilities: [streaming_asr]
    parameters:
      resource_id: volc.bigasr.sauc.duration
      timeout_seconds: 300
      end_window_size: 800
      force_to_speech_time: 1000

  # Active TTS — Fixed Case Runner asset synthesis (PRD-F020, Issue #98).
  # Complete fixed text in, MP3 audio out over the official V3 unidirectional
  # WebSocket protocol. The result is frozen as an immutable MP3 Stimulus
  # Artifact before a formal Run plays it.
  - id: volc-tts
    name: Volcengine V3 TTS (unidirectional WebSocket)
    provider: volcengine
    protocol: volcengine_tts_ws
    base_url: wss://openspeech.bytedance.com/api/v3/tts/unidirectional/stream
    model: "seed-tts-2.0-standard"
    credential_env: VOLCENGINE_TTS_API_KEY
    enabled: true
    capabilities: [tts]
    parameters:
      resource_id: "seed-tts-2.0"
      voice: "<voice-id>"
      sample_rate: 24000
      speed: 0
      volume: 0
      timeout_seconds: 60

  # Active TTS — Free Test Agent streaming session (PRD-F021, Issue #98).
  # Streamed speakable text in, streamed MP3 audio out over the official V3
  # bidirectional WebSocket protocol, so playback can start before the LLM has
  # finished answering.
  - id: volc-streaming-tts
    name: Volcengine V3 TTS (bidirectional WebSocket)
    provider: volcengine
    protocol: volcengine_tts_ws_bidirectional
    base_url: wss://openspeech.bytedance.com/api/v3/tts/bidirection
    model: "seed-tts-2.0-standard"
    credential_env: VOLCENGINE_TTS_API_KEY
    enabled: true
    capabilities: [streaming_tts]
    parameters:
      resource_id: "seed-tts-2.0"
      voice: "<voice-id>"
      sample_rate: 24000
      speed: 0
      volume: 0
      timeout_seconds: 60

routes:
  tts: volc-tts
  streaming_tts: volc-streaming-tts
  asr: volc-file-asr
  streaming_asr: volc-streaming-asr
  diarization: volc-file-asr
  judge: judge-doubao

# Notes
# -----
# * TTS media format is fixed to `mp3` and is intentionally NOT configurable.
#   There is no `format:`/`encoding:` key; a leftover `format: wav` from the
#   retired HTTP SSE era is refused at load time instead of being ignored.
# * `pitch` is accepted only where the selected protocol documents support for
#   it. The V3 unidirectional page still marks pitch adjustment unsupported, so
#   the Fixed profile above must not declare it.
# * `streaming_tts` is a separate route on purpose: a single `volcengine_tts`
#   profile must never make the runtime guess unidirectional vs bidirectional.
