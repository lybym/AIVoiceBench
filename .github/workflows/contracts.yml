name: Contract validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      AIVOICEBENCH_REQUIRE_MEDIA_TESTS: '1'
      # The Silero acoustic-boundary provider is a P0 server capability, so its
      # model gate must run rather than be skipped when the optional VAD runtime is
      # absent from the runner. `requirements-vad.txt` is installed below so the
      # gate can pass, and the variable makes a skip impossible to mistake for it.
      AIVOICEBENCH_REQUIRE_SILERO_TESTS: '1'
      # The Browser Station TypeScript gate must run, not be skipped: without it a
      # source change that was never rebuilt could ship the previous browser logic.
      VT_REQUIRE_WEB_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Browser Station sources are TypeScript and the served JavaScript is their
      # build output; the toolchain is pinned by package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Browser Station typecheck and build determinism
        run: npm run verify
      - run: python -m pip install -r requirements-audio.txt -r requirements-api.txt -r requirements-vad.txt httpx
      - name: Install media tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Ensure media tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
      - run: python -m unittest discover -s tests -v
  # The browser control layer is only truly exercised with a real browser and a
  # controlled microphone, so it gets its own job with the browser dependencies
  # installed. VT_REQUIRE_BROWSER turns "the module was skipped" into a failure.
  browser-acceptance:
    runs-on: ubuntu-latest
    env:
      VT_REQUIRE_BROWSER: '1'
      VT_REQUIRE_WEB_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The page under test is the compiled Browser Station artifact, so the
      # browser job installs the TypeScript toolchain and proves the build is
      # current before driving it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Browser Station typecheck and build determinism
        run: npm run verify
      - run: python -m pip install -r requirements-audio.txt -r requirements-api.txt httpx
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance (controlled TTS + synthetic microphone)
        run: python -m unittest tests.test_voice_browser -v
      # The integration acceptance varies *which* capability each mode has, so it
      # starts its own controlled server per capability profile. It is the case
      # set that proves a missing capability really refuses the run rather than
      # being reported by the UI only.
      - name: Integration acceptance (per-capability profiles, real page)
        run: python -m unittest tests.test_voice_integration_acceptance -v
      # The manual speaker-role gate is a Web/API contract: the review surface, the
      # refusal of an incomplete decision and the reanalysis all have to work through
      # the real page. It is listed explicitly so a skipped module can never be
      # reported as a passed gate.
      - name: Manual speaker-role gate (real page, real API)
        run: python -m unittest tests.test_role_review_browser -v
