name: Contract validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      AIVOICEBENCH_REQUIRE_MEDIA_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-audio.txt -r requirements-api.txt httpx
      - name: Install media tools on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Ensure media tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
      - run: python -m unittest discover -s tests -v
  # The browser control layer is only truly exercised with a real browser and a
  # controlled microphone, so it gets its own job with the browser dependencies
  # installed. VT_REQUIRE_BROWSER turns "the module was skipped" into a failure.
  browser-acceptance:
    runs-on: ubuntu-latest
    env:
      VT_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-audio.txt -r requirements-api.txt httpx
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Browser acceptance (controlled TTS + synthetic microphone)
        run: python -m unittest tests.test_voice_browser -v
