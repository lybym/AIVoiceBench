<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIVoiceBench · 录音分析</title><link rel="stylesheet" href="/static/app.css"></head>
<body><aside><a class="brand" href="#home"><span class="mark">≋</span>AIVoiceBench</a><div class="workspace">语音评测工作台</div><nav><button id="nav-home" class="active" onclick="home()">▤ <span>分析记录</span></button><button id="nav-import" onclick="importView()">＋ <span>导入录音</span></button></nav><div class="sidebar-bottom"><span class="dot"></span> 本地工作空间<small id="version">连接服务中</small></div></aside>
<main><header><span>工作空间 <span class="slash">/</span> <b id="breadcrumb">分析记录</b></span><span class="quiet">Evidence first.</span></header><div class="content"><div id="notice" role="alert" hidden></div>
<section id="home"><div class="title-row"><div><div class="eyebrow">RECORDINGS</div><h1>分析记录</h1><p>从一段真实对话开始，让每个结论都有据可循。</p></div><button class="primary" onclick="importView()">＋ 导入录音</button></div><div class="toolbar"><span id="count">所有记录</span><button class="text-button" onclick="home()">刷新记录 ↻</button></div><div id="runs"></div></section>
<section id="import" hidden><div class="eyebrow">NEW ANALYSIS</div><h1>导入录音</h1><p>上传测试者与设备的完整对话，保留原始音频与分析证据。</p><form id="upload-form"><div class="panel upload-panel"><label class="drop" id="drop" for="file"><span class="upload-icon">↥</span><strong id="file-label">拖放录音到这里，或点击选择</strong><span id="file-size">WAV、MP3、M4A · 最长 30 分钟 · 最大 1 GB</span><input id="file" type="file" accept=".wav,.mp3,.m4a,audio/wav,audio/mpeg,audio/mp4" required></label></div><div class="panel"><h2>设备信息 <span class="optional">选填</span></h2><div class="form-grid" id="fields"></div></div><div class="form-footer"><span id="progress" role="status">录音将保存在当前服务的数据目录中。</span><button class="primary" id="submit" type="submit">开始分析 →</button></div></form></section>
<section id="analysis" hidden><button class="text-button" onclick="home()">← 返回分析记录</button><div class="title-row"><div><div class="eyebrow">ANALYSIS</div><h1 id="analysis-title">录音分析</h1><p id="run-id"></p></div><span id="status"></span></div><div class="panel player"><div><h2>录音回放</h2><span class="quiet">点击语音片段，跳转到对应时间</span></div><audio id="audio" controls preload="metadata"></audio></div><div id="summary" class="stats"></div><div class="tabs" role="tablist"><button role="tab" data-tab="segments" onclick="tab('segments')">语音片段</button><button role="tab" data-tab="metrics" onclick="tab('metrics')">评测指标</button><button role="tab" data-tab="findings" onclick="tab('findings')">发现与评估</button><button role="tab" data-tab="report" onclick="tab('report')">完整报告</button></div><div id="detail" class="panel"></div></section>
<footer>AIVoiceBench <span>可追溯的 AI 语音终端评测</span></footer></div></main><script src="/static/app.js"></script></body></html>
